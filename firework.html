<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Happy Birthday — Fireworks</title>
  <style>
    :root{
      --bg:#05060a;
      --panel: rgba(255,255,255,0.04);
      --accent1:#ff6b6b;
      --accent2:#ffd93d;
      --accent3:#6bffb8;
      --accent4:#7aa2ff;
      --font-sans: 'Poppins', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
    }
    html,body{height:100%;}
    body{
      margin:0;
      background: radial-gradient(ellipse at 20% 10%, rgba(255,255,255,0.02), transparent 10%), radial-gradient(ellipse at 80% 80%, rgba(255,255,255,0.01), transparent 20%), var(--bg);
      color:#fff;
      font-family:var(--font-sans);
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    /* Canvas fills the screen */
    canvas#fwCanvas{
      position:fixed;
      inset:0;
      width:100vw;
      height:100vh;
      display:block;
      z-index:10;
    }

    /* Top controls */
    .ui{
      position:fixed;
      top:18px;
      left:18px;
      z-index:6;
      display:flex;
      gap:8px;
      align-items:center;
      background:var(--panel);
      padding:8px 10px;
      border-radius:12px;
      backdrop-filter: blur(6px) saturate(120%);
      box-shadow: 0 6px 20px rgba(0,0,0,0.45);
    }
    .ui button{
      background:transparent;
      border:1px solid rgba(255,255,255,0.08);
      color:#fff;
      padding:6px 10px;
      border-radius:8px;
      cursor:pointer;
      font-weight:600;
    }
    .ui button:active{transform:translateY(1px)}

    /* Centered greeting (hidden until explosion) */
    .greeting{
      position:relative;
      z-index:20;
      text-align:center;
      pointer-events:none;
      user-select:none;
      transform: translateY(-6vh);
    }
    .greeting h1{
      margin:0;
      font-family:"Comic Sans MS", cursive, sans-serif;
      font-size:clamp(40px, 7vw, 110px);
      letter-spacing:6px;
      text-transform:uppercase;
      line-height:0.9;
      font-weight:900;
      opacity:0;
      transform:translateY(20px) scale(0.9);
      transition:opacity 800ms ease, transform 800ms cubic-bezier(.16,.84,.36,1);
      background: linear-gradient(90deg, #ff0077, #ffae00, #00f5d4, #6a5cff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 10px rgba(255,255,255,0.25)) drop-shadow(0 0 25px rgba(255,255,255,0.15));
      animation: pulse 3s ease-in-out infinite;
    }

    @keyframes pulse {
      0% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-4px) scale(1.05); }
      100% { transform: translateY(0) scale(1); }
    }
    .greeting.show h1{
      opacity:1;
      transform:translateY(0) scale(1);
    }

    .subtitle{
      margin-top:8px;
      font-size:clamp(14px, 2vw, 20px);
      opacity:0;
      transition:opacity 900ms ease 200ms, transform 700ms ease;
      transform: translateY(8px);
      color: rgba(255,255,255,0.9);
    }
    .greeting.show .subtitle{
      opacity:1;
      transform: translateY(0);
    }

    /* small help text bottom */
    .hint{
      position:fixed;
      bottom:18px;
      left:50%;
      transform:translateX(-50%);
      z-index:6;
      background:var(--panel);
      padding:8px 12px;
      border-radius:999px;
      font-size:13px;
      color:rgba(255,255,255,0.9);
      backdrop-filter: blur(6px);
    }

    @media (max-width:520px){
      .ui{top:12px; left:12px}
      .hint{font-size:12px; bottom:12px}
    }
  </style>
</head>
<body>
  <canvas id="fwCanvas"></canvas>

  <div class="ui" aria-hidden="true">
    <button id="btnLaunch">Launch</button>
    <button id="btnAuto">Auto: On</button>
    <button id="btnReset">Reset</button>
  </div>

  <div class="greeting" id="greeting">
    <h1 id="greetingText">Happy Birthday!</h1>
    <div class="subtitle">Semoga hari ini penuh keceriaan 🎉</div>
  </div>

  <div class="hint">Klik/ketuk untuk menembakkan kembang api — tekan <strong>Auto</strong> untuk mode otomatis</div>

  <script>
    // Fireworks canvas animation
    const canvas = document.getElementById('fwCanvas');
    const ctx = canvas.getContext('2d');
    let W = canvas.width = innerWidth;
    let H = canvas.height = innerHeight;

    window.addEventListener('resize', ()=>{
      W = canvas.width = innerWidth;
      H = canvas.height = innerHeight;
    });

    // Utility
    const rand = (min,max) => Math.random()*(max-min)+min;
    const TAU = Math.PI*2;

    // Particles and rockets
    class Rocket{
      constructor(x,y,tx,ty,color){
        this.x = x; this.y = y; this.tx = tx; this.ty = ty;
        this.vx = (tx - x) * 0.02 * rand(0.9,1.15);
        this.vy = (ty - y) * 0.02 * rand(0.9,1.15) - rand(4,7);
        this.age = 0; this.exploded=false;
        this.color = color || `hsl(${rand(0,360)} 80% 60%)`;
      }
      step(){
        this.vy += 0.12; // gravity
        this.x += this.vx;
        this.y += this.vy;
        this.age++;
        const dx = this.x - this.tx, dy = this.y - this.ty;
        if(!this.exploded && (this.age>40 || (dx*dx+dy*dy) < 4000 || this.vy>2)){
          this.explode();
          this.exploded = true;
          return true; // exploded
        }
        return false;
      }
      explode(){
        const count = Math.floor(rand(30,110));
        for(let i=0;i<count;i++){
          particles.push(new Particle(this.x,this.y, this.color));
        }
        // occasionally trigger greeting reveal
        if(rand(0,1) > 0.92){
          showGreeting();
        }
      }
      draw(ctx){
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.beginPath();
        ctx.fillStyle = this.color;
        ctx.arc(this.x,this.y,2.8,0,TAU);
        ctx.fill();
        ctx.restore();
      }
    }

    class Particle{
      constructor(x,y,color){
        this.x = x; this.y = y;
        const angle = rand(0,TAU);
        const speed = Math.pow(rand(0,1),0.6)*rand(1.8,8);
        this.vx = Math.cos(angle)*speed;
        this.vy = Math.sin(angle)*speed;
        this.life = rand(40,120);
        this.age = 0;
        this.size = rand(1,3);
        this.color = color || `hsl(${rand(0,360)} 85% 55%)`;
        this.fr = 0.98; // friction
        this.alpha = 1;
      }
      step(){
        this.vy += 0.06; // gravity slightly
        this.vx *= this.fr; this.vy *= this.fr;
        this.x += this.vx; this.y += this.vy;
        this.age++;
        this.alpha = Math.max(0, 1 - this.age/this.life);
      }
      draw(ctx){
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = this.alpha;
        ctx.beginPath();
        ctx.fillStyle = this.color;
        ctx.arc(this.x,this.y,this.size,0,TAU);
        ctx.fill();
        ctx.restore();
      }
    }

    const particles = [];
    const rockets = [];

    // Auto-launch
    let auto = true;
    let autoTimer = 0;

    // Greeting logic
    const greetingEl = document.getElementById('greeting');
    let greetingShown = false;
    function showGreeting(){
      if(greetingShown) return;
      greetingShown = true;
      greetingEl.classList.add('show');
      // small heartbeat animation after show
      setTimeout(()=>{
        greetingEl.animate([
          { transform: 'translateY(0) scale(1)' },
          { transform: 'translateY(-6px) scale(1.02)' },
          { transform: 'translateY(0) scale(1)'}
        ], { duration: 800, iterations: 2 });
      },300);
    }
    function resetGreeting(){
      greetingShown = false;
      greetingEl.classList.remove('show');
    }

    // launch rocket from bottom at x to target tx,ty
    function launchAt(x, tx, ty){
      const col = `hsl(${rand(0,360)} 80% 60%)`;
      rockets.push(new Rocket(x, H+8, tx, ty, col));
    }

    // random launch helper
    function randomLaunch(){
      const x = rand(W*0.1, W*0.9);
      const tx = rand(W*0.15, W*0.85);
      const ty = rand(H*0.12, H*0.45);
      launchAt(x, tx, ty);
    }

    // draw background glow / subtle starfield
    const stars = [];
    for(let i=0;i<120;i++) stars.push({x:rand(0,W), y:rand(0,H*0.6), r:rand(0.3,1.6), a:rand(0.05,0.9)});

    function step(){
      // fade canvas slightly to create trails
      ctx.fillStyle = 'rgba(4,6,11,0.25)';
      ctx.fillRect(0,0,W,H);

      // draw stars
      ctx.save();
      for(const s of stars){
        ctx.globalAlpha = s.a * 0.9;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r,0,TAU);
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.fill();
      }
      ctx.restore();

      // rockets
      for(let i=rockets.length-1;i>=0;i--){
        const r = rockets[i];
        const exploded = r.step();
        r.draw(ctx);
        if(exploded) rockets.splice(i,1);
      }

      // particles
      for(let i=particles.length-1;i>=0;i--){
        const p = particles[i];
        p.step();
        p.draw(ctx);
        if(p.age > p.life) particles.splice(i,1);
      }

      // occasionally auto launch
      if(auto){
        autoTimer -= 1/60;
        if(autoTimer <= 0){ randomLaunch(); autoTimer = rand(0.4,1.6); }
      }

      requestAnimationFrame(step);
    }

    // initial warmup launches
    for(let i=0;i<4;i++) setTimeout(()=>randomLaunch(), i*350);
    step();

    // UI interactions
    document.getElementById('btnLaunch').addEventListener('click', ()=>{
      const tx = rand(W*0.15, W*0.85);
      const ty = rand(H*0.12, H*0.45);
      launchAt(W/2 + rand(-80,80), tx, ty);
    });
    document.getElementById('btnAuto').addEventListener('click', (e)=>{
      auto = !auto;
      e.currentTarget.textContent = `Auto: ${auto? 'On':'Off'}`;
    });
    document.getElementById('btnReset').addEventListener('click', ()=>{
      rockets.length = 0; particles.length = 0; resetGreeting();
    });

    // click / touch to shoot toward pointer
    function pointerLaunch(clientX, clientY){
      const tx = clientX; const ty = clientY - rand(0,20);
      launchAt(rand(W*0.45, W*0.55), tx, ty);
    }
    canvas.addEventListener('pointerdown', (ev)=>{
      pointerLaunch(ev.clientX, ev.clientY);
    });

    // keyboard space to launch, r reset
    addEventListener('keydown', (e)=>{
      if(e.code === 'Space'){ e.preventDefault(); document.getElementById('btnLaunch').click(); }
      if(e.key.toLowerCase() === 'r'){ document.getElementById('btnReset').click(); }
      if(e.key.toLowerCase() === 'a'){ document.getElementById('btnAuto').click(); }
    });

    // friendly accessibility: allow custom message via prompt triggered by double-click on greeting text
    document.getElementById('greetingText').addEventListener('dblclick', ()=>{
      const txt = prompt('Ganti pesan (tidak boleh kosong):', document.getElementById('greetingText').textContent);
      if(txt && txt.trim()) document.getElementById('greetingText').textContent = txt.trim();
    });

    // small autoplay: reveal greeting after a while if many particles present
    setInterval(()=>{
      if(!greetingShown && (particles.length>350 || Math.random()>0.995)) showGreeting();
    }, 800);

    // initial greeting reveal after some seconds to make the page feel finished
    setTimeout(()=>{ if(!greetingShown && particles.length>60) showGreeting(); }, 4000);

  </script>
</body>
</html>
